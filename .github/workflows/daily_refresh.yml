# Runs grade_bets.py and pushes the new results.csv, so the site shows
# yesterday's results and today's current lines.
#
# Started every morning at 4:35 AM Eastern by cron-job.org, which calls GitHub's
# "run workflow" API (GitHub's own schedule was starting runs hours late).
# cron-job.org sends source=scheduled; the Run workflow button defaults to manual.
# You can still run it any time: GitHub repo -> Actions -> Daily refresh -> Run workflow.

name: Daily refresh

on:
  workflow_dispatch:
    inputs:
      source:
        description: "What started this run (cron-job.org sends 'scheduled')"
        required: false
        default: "manual"

permissions:
  contents: write      # lets the workflow push results.csv

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Record when this refresh started
        run: echo "REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Get the site files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas numpy cfbd

      - name: Grade bets and update current lines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          REFRESH_TRIGGER: ${{ github.event.inputs.source || github.event_name }}
        run: python grade_bets.py

      - name: Commit and push results.csv and last_refresh.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results.csv last_refresh.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
