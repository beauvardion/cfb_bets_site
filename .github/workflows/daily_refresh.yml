# Runs grade_bets.py every morning at 4:35 AM Eastern and pushes the new
# results.csv, so the site shows yesterday's results and today's current lines.
# You can also run it any time: GitHub repo -> Actions -> Daily refresh -> Run workflow.

name: Daily refresh

on:
  schedule:
    # GitHub schedules use UTC. Eastern is UTC-4 March-October (daylight time)
    # and UTC-5 November-February (standard time).
    # Minutes are kept off the top of the hour, when GitHub is busiest and most
    # likely to delay or skip scheduled runs.
    #   4:35 AM Eastern
    - cron: "35 8 * 3-10 *"
    - cron: "35 9 * 11,12,1,2 *"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

permissions:
  contents: write      # lets the workflow push results.csv

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Record when this refresh started
        run: echo "REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Get the site files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas numpy cfbd

      - name: Grade bets and update current lines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          REFRESH_TRIGGER: ${{ github.event_name }}
        run: python grade_bets.py

      - name: Commit and push results.csv and last_refresh.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results.csv last_refresh.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
